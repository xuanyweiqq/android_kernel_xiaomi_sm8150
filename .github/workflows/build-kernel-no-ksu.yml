name: Build Kernel (No KernelSU)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 1

    - name: Setup Build Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          bc bison build-essential ccache curl flex \
          g++-multilib gcc-multilib git gnupg gperf \
          imagemagick lib32ncurses5-dev lib32readline-dev \
          lib32z1-dev liblz4-tool libncurses5 libncurses5-dev \
          libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop \
          pngcrush rsync schedtool squashfs-tools xsltproc zip \
          zlib1g-dev python3 python3-pip wget cpio unzip

    - name: Setup Toolchains
      run: |
        mkdir -p ~/toolchains
        cd ~/toolchains
        echo "=== Downloading Proton Clang ==="
        git clone --depth=1 https://github.com/kdrag0n/proton-clang
        echo "=== Downloading GCC ARM64 ==="
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 gcc-arm64
        echo "=== Downloading GCC ARM ==="
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 gcc-arm
        echo "=== Verify Toolchains ==="
        ls -la ~/toolchains/
        ~/toolchains/proton-clang/bin/clang --version

    - name: Configure Kernel
      run: |
        cd $GITHUB_WORKSPACE
        export ARCH=arm64
        export SUBARCH=arm64
        export PATH=~/toolchains/proton-clang/bin:~/toolchains/gcc-arm64/bin:~/toolchains/gcc-arm/bin:$PATH
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export CROSS_COMPILE=aarch64-linux-android-
        export CROSS_COMPILE_ARM32=arm-linux-androideabi-

        echo "=== Finding defconfig ==="
        if [ -f arch/arm64/configs/vendor/sm8150-perf_defconfig ]; then
          DEFCONFIG="vendor/sm8150-perf_defconfig"
        elif [ -f arch/arm64/configs/vendor/sm8150_defconfig ]; then
          DEFCONFIG="vendor/sm8150_defconfig"
        elif [ -f arch/arm64/configs/sm8150_defconfig ]; then
          DEFCONFIG="sm8150_defconfig"
        else
          DEFCONFIG="defconfig"
        fi
        echo "Using: $DEFCONFIG"

        make O=out ARCH=arm64 CC=clang $DEFCONFIG

        echo "=== Modifying Kernel Config ==="
        scripts/config --file out/.config --enable MODULES
        scripts/config --file out/.config --enable MODULE_UNLOAD
        scripts/config --file out/.config --enable MODVERSIONS
        scripts/config --file out/.config --disable MODULE_SIG
        scripts/config --file out/.config --disable MODULE_SIG_FORCE
        scripts/config --file out/.config --disable MODULE_SIG_ALL
        scripts/config --file out/.config --enable KALLSYMS
        scripts/config --file out/.config --enable KALLSYMS_ALL

        # 启用 KPROBES（cpufake 完整功能需要）
        scripts/config --file out/.config --enable KPROBES
        scripts/config --file out/.config --enable KPROBE_EVENTS
        scripts/config --file out/.config --enable KRETPROBES

        # 保持 DTB overlay 启用 - 与原内核一致
        # scripts/config --file out/.config --disable CONFIG_BUILD_ARM64_DT_OVERLAY
        scripts/config --file out/.config --disable SND_SOC_ELLIPTIC
        scripts/config --file out/.config --disable ELLIPTIC_US
        scripts/config --file out/.config --disable SND_SOC_ELLIPTIC_US
        scripts/config --file out/.config --disable ELLIPTIC

        echo "=== Removing Elliptic Labs files ==="
        if [ -d techpack/audio/dsp/elliptic ]; then
          rm -rf techpack/audio/dsp/elliptic
        fi
        if [ -f techpack/audio/dsp/apr_elliptic.c ]; then
          rm -f techpack/audio/dsp/apr_elliptic.c
          rm -f techpack/audio/dsp/apr_elliptic.o
        fi
        if [ -f techpack/audio/dsp/Makefile ]; then
          sed -i '/elliptic/d' techpack/audio/dsp/Makefile
          sed -i '/apr_elliptic/d' techpack/audio/dsp/Makefile
          sed -i 's/apr_elliptic\.o//g' techpack/audio/dsp/Makefile
        fi
        if [ -f techpack/audio/dsp/Kbuild ]; then
          sed -i '/elliptic/d' techpack/audio/dsp/Kbuild
          sed -i '/apr_elliptic/d' techpack/audio/dsp/Kbuild
          sed -i 's/apr_elliptic\.o//g' techpack/audio/dsp/Kbuild
        fi

        make O=out ARCH=arm64 CC=clang olddefconfig

        echo "=== Verifying Config ==="
        grep "CONFIG_MODULES" out/.config || true
        grep "CONFIG_MODULE_SIG" out/.config || echo "MODULE_SIG disabled"
        grep "CONFIG_KALLSYMS" out/.config || true
        grep "CONFIG_KPROBES" out/.config || true

    - name: Build Kernel
      run: |
        cd $GITHUB_WORKSPACE
        export ARCH=arm64
        export SUBARCH=arm64
        export PATH=~/toolchains/proton-clang/bin:~/toolchains/gcc-arm64/bin:~/toolchains/gcc-arm/bin:$PATH
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export CROSS_COMPILE=aarch64-linux-android-
        export CROSS_COMPILE_ARM32=arm-linux-androideabi-

        make -j$(nproc) O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android- CROSS_COMPILE_ARM32=arm-linux-androideabi- Image.gz-dtb || make -j$(nproc) O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android- CROSS_COMPILE_ARM32=arm-linux-androideabi- Image.gz

    - name: Check Build Result
      run: |
        if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
          echo "Kernel built: Image.gz-dtb"
          ls -lh out/arch/arm64/boot/Image.gz-dtb
        elif [ -f out/arch/arm64/boot/Image.gz ]; then
          echo "Kernel built: Image.gz"
          ls -lh out/arch/arm64/boot/Image.gz
        elif [ -f out/arch/arm64/boot/Image ]; then
          echo "Kernel built: Image"
          ls -lh out/arch/arm64/boot/Image
        else
          echo "No kernel image found"
          exit 1
        fi

    - name: Package AnyKernel3 ZIP
      run: |
        cd $GITHUB_WORKSPACE
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3
        cd AnyKernel3

        # 创建正确的 anykernel.sh
        echo "## AnyKernel3 script" > anykernel.sh
        echo "properties() { '" >> anykernel.sh
        echo "kernel.string=Custom Kernel for Raphael" >> anykernel.sh
        echo "do.devicecheck=1" >> anykernel.sh
        echo "do.modules=0" >> anykernel.sh
        echo "do.systemless=1" >> anykernel.sh
        echo "do.cleanup=1" >> anykernel.sh
        echo "do.cleanuponabort=0" >> anykernel.sh
        echo "device.name1=raphael" >> anykernel.sh
        echo "device.name2=raphaelin" >> anykernel.sh
        echo "supported.versions=" >> anykernel.sh
        echo "supported.patchlevels=" >> anykernel.sh
        echo "'; }" >> anykernel.sh
        echo "" >> anykernel.sh
        echo "block=/dev/block/by-name/boot;" >> anykernel.sh
        echo "is_slot_device=0;" >> anykernel.sh
        echo "ramdisk_compression=auto;" >> anykernel.sh
        echo "" >> anykernel.sh
        echo ". tools/ak3-core.sh;" >> anykernel.sh
        echo "" >> anykernel.sh
        echo "split_boot;" >> anykernel.sh
        echo "flash_boot;" >> anykernel.sh

        if [ -f ../out/arch/arm64/boot/Image.gz-dtb ]; then
          cp ../out/arch/arm64/boot/Image.gz-dtb ./
        elif [ -f ../out/arch/arm64/boot/Image.gz ]; then
          cp ../out/arch/arm64/boot/Image.gz ./
        elif [ -f ../out/arch/arm64/boot/Image ]; then
          cp ../out/arch/arm64/boot/Image ./
        fi

        ZIPNAME="Kernel-raphael-$(date +%Y%m%d-%H%M).zip"
        zip -r9 ../$ZIPNAME * -x .git README.md .gitignore
        cd ..
        ls -lh $ZIPNAME

    - name: Generate Build Info
      run: |
        cd $GITHUB_WORKSPACE
        BUILDINFO="build-info.txt"
        echo "=== Kernel Build Info ===" > $BUILDINFO
        echo "Device: Redmi K20 Pro (raphael)" >> $BUILDINFO
        echo "Kernel Version: $(make kernelversion O=out)" >> $BUILDINFO
        echo "Build Date: $(date)" >> $BUILDINFO
        echo "Builder: GitHub Actions" >> $BUILDINFO
        echo "" >> $BUILDINFO
        echo "=== Critical Configs ===" >> $BUILDINFO
        echo "CONFIG_MODULE_SIG_FORCE disabled - can load unsigned modules" >> $BUILDINFO
        echo "" >> $BUILDINFO
        grep -E "CONFIG_MODULES=|CONFIG_MODULE_SIG|CONFIG_KALLSYMS=|CONFIG_KPROBES=" out/.config >> $BUILDINFO || true
        cat $BUILDINFO

    - name: Upload Kernel Image
      uses: actions/upload-artifact@v4
      with:
        name: kernel-image
        path: out/arch/arm64/boot/Image*

    - name: Upload AnyKernel3 ZIP
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-Flashable-ZIP
        path: Kernel-raphael-*.zip

    - name: Upload Build Info
      uses: actions/upload-artifact@v4
      with:
        name: build-info
        path: build-info.txt
