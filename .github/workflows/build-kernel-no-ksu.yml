name: Build Kernel (No KernelSU)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 1

    - name: Setup Build Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          bc bison build-essential ccache curl flex \
          g++-multilib gcc-multilib git gnupg gperf \
          imagemagick lib32ncurses5-dev lib32readline-dev \
          lib32z1-dev liblz4-tool libncurses5 libncurses5-dev \
          libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop \
          pngcrush rsync schedtool squashfs-tools xsltproc zip \
          zlib1g-dev python3 python3-pip wget cpio unzip

    - name: Setup Toolchains
      run: |
        mkdir -p ~/toolchains
        cd ~/toolchains

        echo "=== 下载 Proton Clang ==="
        git clone --depth=1 https://github.com/kdrag0n/proton-clang

        echo "=== 下载 GCC ARM64 ==="
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 gcc-arm64

        echo "=== 下载 GCC ARM ==="
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 gcc-arm

        echo "=== 验证工具链 ==="
        ls -la ~/toolchains/
        ~/toolchains/proton-clang/bin/clang --version

    - name: Configure Kernel
      run: |
        cd $GITHUB_WORKSPACE

        export ARCH=arm64
        export SUBARCH=arm64
        export PATH=~/toolchains/proton-clang/bin:~/toolchains/gcc-arm64/bin:~/toolchains/gcc-arm/bin:$PATH
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export CROSS_COMPILE=aarch64-linux-android-
        export CROSS_COMPILE_ARM32=arm-linux-androideabi-

        echo "=== 查找 defconfig ==="
        if [ -f arch/arm64/configs/vendor/sm8150-perf_defconfig ]; then
          DEFCONFIG="vendor/sm8150-perf_defconfig"
        elif [ -f arch/arm64/configs/vendor/sm8150_defconfig ]; then
          DEFCONFIG="vendor/sm8150_defconfig"
        elif [ -f arch/arm64/configs/sm8150_defconfig ]; then
          DEFCONFIG="sm8150_defconfig"
        else
          DEFCONFIG="defconfig"
        fi
        echo "使用: $DEFCONFIG"

        make O=out ARCH=arm64 CC=clang $DEFCONFIG

        echo "=== 修改内核配置（禁用模块签名） ==="
        # 启用模块支持
        scripts/config --file out/.config --enable MODULES
        scripts/config --file out/.config --enable MODULE_UNLOAD
        scripts/config --file out/.config --enable MODVERSIONS

        # ⭐ 禁用模块签名（关键！允许加载 cpufake 模块）
        scripts/config --file out/.config --disable MODULE_SIG
        scripts/config --file out/.config --disable MODULE_SIG_FORCE
        scripts/config --file out/.config --disable MODULE_SIG_ALL

        # 启用符号表（cpufake 需要）
        scripts/config --file out/.config --enable KALLSYMS
        scripts/config --file out/.config --enable KALLSYMS_ALL

        # 启用 Kprobes（cpufake 需要）
        scripts/config --file out/.config --enable KPROBES
        scripts/config --file out/.config --enable KPROBE_EVENTS
        scripts/config --file out/.config --enable KRETPROBES

        # 禁用 DTB overlay（避免编译错误）
        scripts/config --file out/.config --disable CONFIG_BUILD_ARM64_DT_OVERLAY

        # 禁用 Elliptic Labs 驱动（缺少闭源库 elus_afe）
        scripts/config --file out/.config --disable SND_SOC_ELLIPTIC
        scripts/config --file out/.config --disable ELLIPTIC_US
        scripts/config --file out/.config --disable SND_SOC_ELLIPTIC_US
        scripts/config --file out/.config --disable ELLIPTIC

        # 如果 config 禁用不生效，直接删除相关文件
        if [ -f techpack/audio/dsp/apr_elliptic.c ]; then
          echo "=== 删除 apr_elliptic.c 避免链接错误 ==="
          rm -f techpack/audio/dsp/apr_elliptic.c
          rm -f techpack/audio/dsp/apr_elliptic.o
        fi

        # 修改 Makefile 移除 elliptic 编译
        if [ -f techpack/audio/dsp/Makefile ]; then
          sed -i '/apr_elliptic/d' techpack/audio/dsp/Makefile
        fi

        make O=out ARCH=arm64 CC=clang olddefconfig

        echo "=== 验证配置 ==="
        echo "模块支持:"
        grep "CONFIG_MODULES" out/.config
        echo "模块签名:"
        grep "CONFIG_MODULE_SIG" out/.config || echo "✅ MODULE_SIG 已禁用"
        echo "符号表:"
        grep "CONFIG_KALLSYMS" out/.config
        echo "Kprobes:"
        grep "CONFIG_KPROBES" out/.config

    - name: Build Kernel
      run: |
        cd $GITHUB_WORKSPACE

        export ARCH=arm64
        export SUBARCH=arm64
        export PATH=~/toolchains/proton-clang/bin:~/toolchains/gcc-arm64/bin:~/toolchains/gcc-arm/bin:$PATH
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export CROSS_COMPILE=aarch64-linux-android-
        export CROSS_COMPILE_ARM32=arm-linux-androideabi-

        # 只编译内核镜像
        make -j$(nproc) O=out ARCH=arm64 \
          CC=clang \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-android- \
          CROSS_COMPILE_ARM32=arm-linux-androideabi- \
          Image.gz-dtb || make -j$(nproc) O=out ARCH=arm64 \
          CC=clang \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-android- \
          CROSS_COMPILE_ARM32=arm-linux-androideabi- \
          Image.gz

    - name: Check Build Result
      run: |
        if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
          echo "✅ Kernel built: Image.gz-dtb"
          ls -lh out/arch/arm64/boot/Image.gz-dtb
        elif [ -f out/arch/arm64/boot/Image.gz ]; then
          echo "✅ Kernel built: Image.gz"
          ls -lh out/arch/arm64/boot/Image.gz
        elif [ -f out/arch/arm64/boot/Image ]; then
          echo "✅ Kernel built: Image"
          ls -lh out/arch/arm64/boot/Image
        else
          echo "❌ No kernel image found"
          exit 1
        fi

    - name: Package AnyKernel3 ZIP
      run: |
        cd $GITHUB_WORKSPACE

        git clone --depth=1 https://github.com/osm0sis/AnyKernel3
        cd AnyKernel3

        # 配置 AnyKernel3
        cat > anykernel.sh << 'EOFMARKER'
        # AnyKernel3 Ramdisk Mod Script
        properties() {
        kernel.string=Custom Kernel for Raphael (MODULE_SIG_FORCE disabled)
        do.devicecheck=1
        do.modules=0
        do.systemless=1
        do.cleanup=1
        do.cleanuponabort=0
        device.name1=raphael
        device.name2=raphaelin
        supported.versions=
        supported.patchlevels=
        }

        block=/dev/block/bootdevice/by-name/boot;
        is_slot_device=0;
        ramdisk_compression=auto;

        . tools/ak3-core.sh;

        dump_boot;
        write_boot;
        EOFMARKER

        # 复制内核镜像
        if [ -f ../out/arch/arm64/boot/Image.gz-dtb ]; then
          cp ../out/arch/arm64/boot/Image.gz-dtb ./
        elif [ -f ../out/arch/arm64/boot/Image.gz ]; then
          cp ../out/arch/arm64/boot/Image.gz ./
        elif [ -f ../out/arch/arm64/boot/Image ]; then
          cp ../out/arch/arm64/boot/Image ./
        fi

        # 打包
        zip -r9 ../Kernel-raphael-NoModuleSig-$(date +%Y%m%d-%H%M).zip * -x .git README.md .gitignore

        cd ..
        ls -lh Kernel-raphael-*.zip

    - name: Generate Build Info
      run: |
        cd $GITHUB_WORKSPACE

        echo "=== Kernel Build Info ===" > build-info.txt
        echo "Device: Redmi K20 Pro (raphael)" >> build-info.txt
        echo "Kernel Version: $(make kernelversion O=out)" >> build-info.txt
        echo "Build Date: $(date)" >> build-info.txt
        echo "Builder: GitHub Actions" >> build-info.txt
        echo "" >> build-info.txt
        echo "=== 关键配置 ===" >> build-info.txt
        echo "⭐ CONFIG_MODULE_SIG_FORCE 已禁用 - 可以加载未签名的内核模块（如 cpufake）" >> build-info.txt
        echo "" >> build-info.txt
        grep -E "CONFIG_MODULES=|CONFIG_MODULE_SIG|CONFIG_KALLSYMS=|CONFIG_KPROBES=" out/.config >> build-info.txt

        cat build-info.txt

    - name: Upload Kernel Image
      uses: actions/upload-artifact@v4
      with:
        name: kernel-image
        path: out/arch/arm64/boot/Image*

    - name: Upload AnyKernel3 ZIP
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-Flashable-ZIP
        path: Kernel-raphael-*.zip

    - name: Upload Build Info
      uses: actions/upload-artifact@v4
      with:
        name: build-info
        path: build-info.txt
