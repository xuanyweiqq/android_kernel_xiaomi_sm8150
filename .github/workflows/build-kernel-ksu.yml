name: Build Kernel with KernelSU (Simple)

on:
  workflow_dispatch:
    inputs:
      kernelsu_version:
        description: 'KernelSU version tag (e.g., v0.9.5)'
        required: true
        default: 'v0.9.5'

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 1

    - name: Setup Build Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          bc bison build-essential ccache curl flex \
          g++-multilib gcc-multilib git gnupg gperf \
          imagemagick lib32ncurses5-dev lib32readline-dev \
          lib32z1-dev liblz4-tool libncurses5 libncurses5-dev \
          libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop \
          pngcrush rsync schedtool squashfs-tools xsltproc zip \
          zlib1g-dev python3 python3-pip wget cpio unzip

    - name: Setup Toolchains (Proton Clang Only)
      run: |
        mkdir -p ~/toolchains
        cd ~/toolchains

        echo "=== 下载 Proton Clang ==="
        git clone --depth=1 https://github.com/kdrag0n/proton-clang

        echo "=== 下载 GCC ARM64 ==="
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 gcc-arm64

        echo "=== 下载 GCC ARM ==="
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 gcc-arm

        echo "=== 验证工具链 ==="
        ls -la ~/toolchains/
        ~/toolchains/proton-clang/bin/clang --version

    - name: Integrate KernelSU
      run: |
        cd $GITHUB_WORKSPACE

        echo "=== 检查内核版本 ==="
        KERNEL_VERSION=$(make kernelversion)
        echo "内核版本: $KERNEL_VERSION"

        # KernelSU 对 4.14 内核的兼容性较差，我们需要使用旧版本或跳过
        echo "=== 尝试集成 KernelSU ==="
        if curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s ${{ github.event.inputs.kernelsu_version }}; then
          if [ -d "KernelSU" ] || [ -d "drivers/kernelsu" ]; then
            echo "✅ KernelSU integrated"
            ls -la KernelSU 2>/dev/null || ls -la drivers/kernelsu

            # 为 4.14 内核打补丁修复 syscall_fn_t 问题
            if [ -f "drivers/kernelsu/hook/syscall_hook.h" ]; then
              echo "=== 修复 KernelSU 类型兼容性 ==="
              sed -i '1i#ifndef syscall_fn_t\ntypedef void (*syscall_fn_t)(void);\n#endif' drivers/kernelsu/hook/syscall_hook.h || true
            fi
          else
            echo "⚠️ KernelSU integration failed, continuing without KernelSU"
          fi
        else
          echo "⚠️ KernelSU setup script failed, continuing without KernelSU"
        fi

    - name: Configure Kernel
      run: |
        cd $GITHUB_WORKSPACE

        export ARCH=arm64
        export SUBARCH=arm64
        export PATH=~/toolchains/proton-clang/bin:~/toolchains/gcc-arm64/bin:~/toolchains/gcc-arm/bin:$PATH
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export CROSS_COMPILE=aarch64-linux-android-
        export CROSS_COMPILE_ARM32=arm-linux-androideabi-

        echo "=== 查找 defconfig ==="
        if [ -f arch/arm64/configs/vendor/sm8150-perf_defconfig ]; then
          DEFCONFIG="vendor/sm8150-perf_defconfig"
        elif [ -f arch/arm64/configs/vendor/sm8150_defconfig ]; then
          DEFCONFIG="vendor/sm8150_defconfig"
        elif [ -f arch/arm64/configs/sm8150_defconfig ]; then
          DEFCONFIG="sm8150_defconfig"
        else
          DEFCONFIG="defconfig"
        fi
        echo "使用: $DEFCONFIG"

        make O=out ARCH=arm64 CC=clang $DEFCONFIG

        echo "=== 修改内核配置 ==="
        # 启用模块支持
        scripts/config --file out/.config --enable MODULES
        scripts/config --file out/.config --enable MODULE_UNLOAD
        scripts/config --file out/.config --enable MODVERSIONS

        # 禁用模块签名（关键！）
        scripts/config --file out/.config --disable MODULE_SIG
        scripts/config --file out/.config --disable MODULE_SIG_FORCE
        scripts/config --file out/.config --disable MODULE_SIG_ALL

        # 启用符号表
        scripts/config --file out/.config --enable KALLSYMS
        scripts/config --file out/.config --enable KALLSYMS_ALL

        # 启用 Kprobes
        scripts/config --file out/.config --enable KPROBES
        scripts/config --file out/.config --enable KPROBE_EVENTS
        scripts/config --file out/.config --enable KRETPROBES

        # 禁用 DTB 编译（避免 DTS 错误）
        scripts/config --file out/.config --disable CONFIG_BUILD_ARM64_DT_OVERLAY

        make O=out ARCH=arm64 CC=clang olddefconfig

        echo "=== 验证配置 ==="
        grep "CONFIG_MODULES" out/.config
        grep "CONFIG_MODULE_SIG" out/.config || echo "✅ MODULE_SIG disabled"
        grep "CONFIG_KALLSYMS" out/.config
        grep "CONFIG_KPROBES" out/.config

    - name: Build Kernel
      run: |
        cd $GITHUB_WORKSPACE

        export ARCH=arm64
        export SUBARCH=arm64
        export PATH=~/toolchains/proton-clang/bin:~/toolchains/gcc-arm64/bin:~/toolchains/gcc-arm/bin:$PATH
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export CROSS_COMPILE=aarch64-linux-android-
        export CROSS_COMPILE_ARM32=arm-linux-androideabi-

        # 只编译内核镜像，跳过 DTB
        make -j$(nproc) O=out ARCH=arm64 \
          CC=clang \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-android- \
          CROSS_COMPILE_ARM32=arm-linux-androideabi- \
          Image.gz-dtb || make -j$(nproc) O=out ARCH=arm64 \
          CC=clang \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-android- \
          CROSS_COMPILE_ARM32=arm-linux-androideabi- \
          Image.gz

    - name: Check Build Result
      run: |
        if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
          echo "✅ Kernel built: Image.gz-dtb"
          ls -lh out/arch/arm64/boot/Image.gz-dtb
        elif [ -f out/arch/arm64/boot/Image.gz ]; then
          echo "✅ Kernel built: Image.gz"
          ls -lh out/arch/arm64/boot/Image.gz
        elif [ -f out/arch/arm64/boot/Image ]; then
          echo "✅ Kernel built: Image"
          ls -lh out/arch/arm64/boot/Image
        else
          echo "❌ No kernel image found"
          exit 1
        fi

    - name: Package AnyKernel3 ZIP
      run: |
        cd $GITHUB_WORKSPACE

        git clone --depth=1 https://github.com/osm0sis/AnyKernel3
        cd AnyKernel3

        # 配置 AnyKernel3
        cat > anykernel.sh << 'EOFMARKER'
        # AnyKernel3 Ramdisk Mod Script
        properties() {
        kernel.string=KernelSU for Raphael by xuanyweiqq
        do.devicecheck=1
        do.modules=0
        do.systemless=1
        do.cleanup=1
        do.cleanuponabort=0
        device.name1=raphael
        device.name2=raphaelin
        supported.versions=
        supported.patchlevels=
        }

        block=/dev/block/bootdevice/by-name/boot;
        is_slot_device=0;
        ramdisk_compression=auto;

        . tools/ak3-core.sh;

        dump_boot;
        write_boot;
        EOFMARKER

        # 复制内核镜像
        if [ -f ../out/arch/arm64/boot/Image.gz-dtb ]; then
          cp ../out/arch/arm64/boot/Image.gz-dtb ./
        elif [ -f ../out/arch/arm64/boot/Image.gz ]; then
          cp ../out/arch/arm64/boot/Image.gz ./
        elif [ -f ../out/arch/arm64/boot/Image ]; then
          cp ../out/arch/arm64/boot/Image ./
        fi

        # 打包
        zip -r9 ../KernelSU-raphael-$(date +%Y%m%d-%H%M).zip * -x .git README.md .gitignore

        cd ..
        ls -lh KernelSU-raphael-*.zip

    - name: Generate Build Info
      run: |
        cd $GITHUB_WORKSPACE

        echo "=== Kernel Build Info ===" > build-info.txt
        echo "Device: Redmi K20 Pro (raphael)" >> build-info.txt
        echo "Kernel Version: $(make kernelversion O=out)" >> build-info.txt
        echo "KernelSU: ${{ github.event.inputs.kernelsu_version }}" >> build-info.txt
        echo "Build Date: $(date)" >> build-info.txt
        echo "Builder: GitHub Actions" >> build-info.txt
        echo "" >> build-info.txt
        echo "=== Critical Configs ===" >> build-info.txt
        grep -E "CONFIG_MODULES=|CONFIG_MODULE_SIG|CONFIG_KALLSYMS=|CONFIG_KPROBES=" out/.config >> build-info.txt

        cat build-info.txt

    - name: Upload Kernel Image
      uses: actions/upload-artifact@v4
      with:
        name: kernel-image
        path: out/arch/arm64/boot/Image*

    - name: Upload AnyKernel3 ZIP
      uses: actions/upload-artifact@v4
      with:
        name: KernelSU-Flashable-ZIP
        path: KernelSU-raphael-*.zip

    - name: Upload Build Info
      uses: actions/upload-artifact@v4
      with:
        name: build-info
        path: build-info.txt
